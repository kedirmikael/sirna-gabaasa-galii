<!doctype html>
<html lang="om">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b76">
<title>Sirna Gabaasa Galii Guyyaa Guyyaa</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--blue:#123b76;--teal:#087f8c;--bg:#eef3f9;--ink:#15243a;--muted:#61738b;--border:#d8e2ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf4ff,#f4f8fb);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink);padding:clamp(8px,3vw,22px)}.wrap{max-width:900px;margin:auto;background:white;border:1px solid #e3eaf3;border-radius:20px;box-shadow:0 12px 40px #163b6812;overflow:hidden}.header{background:linear-gradient(120deg,#123b76,#176e91);color:white;padding:24px 18px;text-align:center}.header h1{font-size:clamp(20px,5vw,28px);margin:0 0 6px}.header p{margin:0;color:#e1efff;font-size:14px}.tabs{display:flex;gap:8px;padding:12px;background:#f7f9fc;border-bottom:1px solid var(--border)}.tab{flex:1;border:0;border-radius:10px;padding:12px;background:#e4ebf4;color:#28425e;font-weight:700;font-size:15px}.tab.active{background:var(--blue);color:white}.section{padding:clamp(14px,4vw,24px)}h2,h3{color:var(--blue);text-align:center;margin:5px 0 18px}label{display:block;margin:13px 0 5px;font-weight:650;font-size:14px}input,select,textarea{width:100%;border:1px solid #cbd7e5;border-radius:10px;padding:12px;font:inherit;font-size:16px;background:white;min-height:46px}textarea{resize:vertical}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:12px 15px;font-weight:700;font-size:15px;min-height:44px}.btn:disabled{opacity:.6}.submit{width:100%;margin-top:18px}.secondary{background:var(--teal)}.status{min-height:24px;text-align:center;margin-top:12px;font-weight:600}.good{color:#16733b}.bad{color:#b42318}.hide{display:none!important}.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.row input{flex:1;min-width:150px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:17px 0}.card{padding:14px;text-align:center;border:1px solid var(--border);background:#f8fbff;border-radius:12px}.card small{color:var(--muted);font-weight:650}.value{font-size:19px;font-weight:800;margin-top:5px;color:var(--blue);overflow-wrap:anywhere}.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:610px;font-size:14px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}th{background:#f3f7fc;color:#334b68}tr:last-child td{border-bottom:0}.foot{text-align:center;color:var(--muted);font-size:12px;padding:12px}.install{display:none;margin:10px 16px 0}.install.show{display:block}@media(max-width:520px){.header{padding:20px 12px}.tabs{padding:9px}.tab{font-size:14px;padding:10px 5px}.section{padding:13px}.row .btn{flex:1}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main class="wrap"><header class="header"><h1>Sirna Gabaasa Galii Guyyaa Guyyaa</h1><p>Galii galmeessuu fi gabaasa guyyaa ilaaluuf</p></header>
<button id="installBtn" class="btn install">📲 App kana Android irratti Install godhi</button>
<nav class="tabs"><button id="formTab" class="tab active" type="button" onclick="switchTab('form')">Unka Galii</button><button id="adminTab" class="tab" type="button" onclick="switchTab('admin')">Admin Dashboard</button></nav>
<section id="formSection" class="section"><h2>Gabaasa Galii Galchi</h2><form id="incomeForm">
<label for="date">Guyyaa Galii *</label><input type="date" id="date" required>
<label for="collector">Maqaa Sassaabaa / ID *</label><select id="collector" required><option value="">-- Sassaabaa Filadhu --</option></select>
<label for="type">Gosa Galii / Bakka *</label><select id="type" required><option value="">-- Gosa Galii Filadhu --</option></select>
<label for="amount">Mallaqa (ETB) *</label><input type="number" id="amount" min="0.01" step="0.01" inputmode="decimal" placeholder="Fkn. 2500" required>
<label for="method">Haala Kaffaltii *</label><select id="method" required><option value="">-- Filadhu --</option><option>Cash (Callaadhhaan)</option><option>Mobile Banking / Telebirr</option><option>Bank Transfer</option></select>
<label for="receipt">Lakkoofsa Nagahee / Transaction ID (optional)</label><input id="receipt" maxlength="100" placeholder="Yoo jiraate galchi">
<label for="note">Yaada Dabalataa (optional)</label><textarea id="note" rows="2" maxlength="500" placeholder="Ibsa dabalataa"></textarea>
<button id="sendBtn" class="btn submit" type="submit">Gabaasa Ergi</button><div id="formStatus" class="status" role="status" aria-live="polite"></div></form></section>
<section id="adminSection" class="section hide"><div id="login"><h3>Seensa Bulchaa</h3><label for="password">Password Admin</label><input type="password" id="password" autocomplete="current-password"><button class="btn submit" type="button" onclick="adminLogin()">Seeni</button><div id="loginStatus" class="status bad"></div></div>
<div id="dashboard" class="hide"><h2>Gabaasa Bulchaa</h2><label for="filter">Guyyaa filadhu</label><div class="row"><input type="date" id="filter"><button class="btn secondary" onclick="loadRecords()">Haaromsi</button><button class="btn secondary" onclick="downloadCSV()">CSV</button><button class="btn" onclick="logout()">Ba'i</button></div><div id="dashStatus" class="status"></div><div class="cards"><div class="card"><small>Waliigala</small><div class="value" id="total">0 ETB</div></div><div class="card"><small>Cash</small><div class="value" id="cash">0 ETB</div></div><div class="card"><small>Mobile</small><div class="value" id="mobile">0 ETB</div></div><div class="card"><small>Bank</small><div class="value" id="bank">0 ETB</div></div></div><div class="table-wrap"><table><thead><tr><th>Sassaabaa</th><th>Gosa</th><th>Mallaqa</th><th>Kaffaltii</th><th>Nagahee</th><th>Yaada</th></tr></thead><tbody id="tableBody"></tbody></table></div></div></section><div class="foot">Sirna Gabaasa Galii • Version 2</div></main>
<script>
// URL Web App /exec kee. Apps Script URL kan user provided.
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyG1l1zaM-rQWCH_S6Z65aGDhQZO5HBOSI3PR04Uy5AX_lpLDgoXM3ZQ791_1Pzy_Sk/exec';
const COLLECTORS=['S-01: Abdii Hassan','S-02: Abraahim Mahammad','S-03: Bayaan Aadam','S-04: Mahammad Abdalla','S-05: Siraj Usmaail','S-06: Iftuu Mahammad','S-07: Abdii Ahmad'];
const INCOME_TYPES=['Baaxii Gooroo','Gibira Lafa Qona','Jimaa','Liizii DD','Liizii DB','Kaartaa','Parsantaa','Hayama ijaarumsaa','Miila Maandiisaa','Kaffaltii Tajaajilaa','Kan Biroo'];
let records=[], filtered=[], adminPassword='';
const $=id=>document.getElementById(id);
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
$('date').value=today();$('filter').value=today();
COLLECTORS.forEach(v=>{const o=new Option(v,v);$('collector').add(o)});INCOME_TYPES.forEach(v=>{const o=new Option(v,v);$('type').add(o)});
function switchTab(t){const form=t==='form';$('formSection').classList.toggle('hide',!form);$('adminSection').classList.toggle('hide',form);$('formTab').classList.toggle('active',form);$('adminTab').classList.toggle('active',!form)}
function jsonp(action,password=''){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(Error('Server irraa deebiin hin dhufne. URL/deploy ilaali.'))},15000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=data=>{cleanup();resolve(data)};s.onerror=()=>{cleanup();reject(Error('Server waliin walqunnamtiin hin milkoofne.'))};const p=new URLSearchParams({action,callback:cb});if(password)p.set('password',password);s.src=SCRIPT_URL+'?'+p;document.body.appendChild(s)})}
$('incomeForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('sendBtn'),st=$('formStatus');const data={guyyaa:$('date').value,maqaa:$('collector').value,gosa:$('type').value,mallaqa:Number($('amount').value),haala:$('method').value,nagahee:$('receipt').value.trim(),yaada:$('note').value.trim()};if(!(data.mallaqa>0&&Number.isFinite(data.mallaqa))){st.className='status bad';st.textContent='Mallaqa sirrii galchi.';return}btn.disabled=true;btn.textContent='Ergaa jira...';st.className='status';st.textContent='Ergaa gara serveritti ergaa jira. Dashboard irraa mirkaneeffadhu.';try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});st.className='status good';st.textContent='Request ergame. Galmeen server irratti jiraachuu isaa Admin dashboard haaromsuun mirkaneessi.';e.target.reset();$('date').value=today()}catch(err){st.className='status bad';st.textContent='Erguun hin milkoofne. Internet/link ilaali.'}finally{btn.disabled=false;btn.textContent='Gabaasa Ergi'}});
async function adminLogin(){const p=$('password').value;if(!p){$('loginStatus').textContent='Password galchi.';return}try{$('loginStatus').textContent='Mirkaneessaa jira...';const r=await jsonp('auth',p);if(r&&r.ok){adminPassword=p;$('login').classList.add('hide');$('dashboard').classList.remove('hide');$('loginStatus').textContent='';await loadRecords()}else $('loginStatus').textContent='Password dogoggora.'}catch(e){$('loginStatus').textContent=e.message}}
function logout(){adminPassword='';records=[];filtered=[];$('password').value='';$('dashboard').classList.add('hide');$('login').classList.remove('hide');$('loginStatus').textContent='';switchTab('form')}
async function loadRecords(){const st=$('dashStatus');st.className='status';st.textContent='Daataa fidaa jira...';try{const r=await jsonp('records',adminPassword);if(!r||!r.ok)throw Error(r?.error||'Deebii sirrii hin taane');records=Array.isArray(r.records)?r.records:[];st.textContent='';render()}catch(e){st.className='status bad';st.textContent=e.message}}
function dateNorm(v){if(!v)return'';const s=String(v);if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`:s}
function fmt(n){return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2})+' ETB'}
function render(){filtered=records.filter(x=>dateNorm(x.guyyaa)===$('filter').value);let total=0,c=0,m=0,b=0;const tb=$('tableBody');tb.replaceChildren();filtered.forEach(x=>{let a=Number(x.mallaqa)||0;total+=a;const method=String(x.haala||'');if(method.includes('Cash'))c+=a;else if(method.includes('Mobile'))m+=a;else if(method.includes('Bank'))b+=a;const tr=document.createElement('tr');[x.maqaa,x.gosa,fmt(a),x.haala,x.nagahee,x.yaada].forEach(v=>{const td=document.createElement('td');td.textContent=v==null?'':String(v);tr.append(td)});tb.append(tr)});if(!filtered.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='Guyyaa kana galmeen hin jiru.';td.style.textAlign='center';tr.append(td);tb.append(tr)}$('total').textContent=fmt(total);$('cash').textContent=fmt(c);$('mobile').textContent=fmt(m);$('bank').textContent=fmt(b)}$('filter').addEventListener('change',render);
function downloadCSV(){if(!filtered.length){alert('Guyyaa kanaaf gabaasni hin jiru.');return}const head=['Guyyaa','Sassaabaa','Gosa Galii','Mallaqa ETB','Haala Kaffaltii','Nagahee','Yaada'];const rows=filtered.map(r=>[dateNorm(r.guyyaa),r.maqaa,r.gosa,r.mallaqa,r.haala,r.nagahee,r.yaada]);const csv='\ufeff'+[head,...rows].map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gabaasa-galii-'+$('filter').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installBtn').classList.add('show')});$('installBtn').addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installBtn').classList.remove('show')});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
